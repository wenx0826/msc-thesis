<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Doc-Based Process Modeller</title>
  <script type="text/javascript" src="https://cpee.org/js_libs/jquery.min.js"></script>
  <script type="text/javascript" src="https://cpee.org/js_libs/jquery.browser.js"></script>
  <script type="text/javascript" src="https://cpee.org/js_libs/uidash.js" defer></script>
  <link rel="stylesheet" href="https://cpee.org/js_libs/uidash.css" type="text/css" />

  <script src="pages/stats/init.js" type="module"></script>
  <link rel="stylesheet" href="assets/global.css" type="text/css" />
  <link rel="stylesheet" href="pages/stats/stats.css" type="text/css" />
</head>

<body is="x-ui-">
  <ui-bar class="header">
    <ul class="breadcrumb">
      <li><a href="index.html" title="Home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9,22 9,12 15,12 15,22"></polyline>
          </svg></a></li>
      <li>
        <a id="projectLink"></a>
      </li>
      <li>Statistics</li>
    </ul>
    <div class="right">
      <div id="viewSwitch" class="switch-btn-group">
        <button class="switch-btn is-current" data-value="all">
          All
        </button>
        <button class="switch-btn" data-value="active">
          Active
        </button>
      </div>
    </div>
  </ui-bar>
  <!-- <a href="index.html" class="back-link">← Back to Projects</a> -->
  <ui-rest style="z-index: 2" class="main" data-current-scope="all">
    <div class="page-rail">
      <section class="kpis" aria-label="Key statistics">
        <div class="kpi">
          <div class="kpiTitle">
            <span class="kpi-title-all">All Documents</span>
            <span class="kpi-title-active">Documents</span>
          </div>
          <div class="kpiValue" id="kpiDocs">—</div>
          <div class="kpiMeta" id="kpiDocsMeta"></div>
        </div>
        <div class="kpi">
          <div class="kpiTitle">
            <span class="kpi-title-all">All Models</span>
            <span class="kpi-title-active">Models</span>
          </div>
          <div class="kpiValue" id="kpiModels">—</div>
          <div class="kpiMeta" id="kpiModelsMeta"></div>
        </div>
      </section>
      <section id="documentsList">
      </section>
      <template id="documentItemTemplate">
        <ui-tabbed style="z-index: 2">
          <ui-tabbar>
            <ui-tab class="switch"></ui-tab>
            <ui-tab class="" style="flex: 1">
              <div class="entity-title">
                <div class="entity-title-main">
                  <h3 style="font-size: 1rem;"><span class="document-name" data-ref="documentName"></span></h3>
                  <span class="pill status-pill" data-ref="documentStatusPill"></span>
                </div>
                <button type="button" class="restore-btn" data-ref="restoreDocumentButton" hidden>
                  Restore
                </button>
              </div>
              <!-- <div class="field" style="font-size: 0.8rem;">
                <label for="docVersionSelect">Version:</label>
                <span data-ref="documentVersion"></span> -->
              <!-- <select id="docVersionSelect"></select> -->
              <!-- </div> -->
              <ul class="document-info" style="font-size: 0.8rem;">
                <li>version: <span data-ref="documentVersion"></span></li>
                <li>words: <span data-ref="wordsCount"></span></li>
                <li>
                  models: <span data-ref="modelsCount"></span>
                  <span class="models-stats" data-ref="modelsStats"></span>
                </li>
                <li><a data-ref="documentLink" target="_blank">View Document</a></li>
              </ul>
            </ui-tab>
          </ui-tabbar>
          <ui-content>
            <ui-area>
              <ul data-ref="modelsGrid">
              </ul>
            </ui-area>
          </ui-content>
        </ui-tabbed>
      </template>

      <template id="modelGridTemplate">
        <li data-model-id="">
          <div class="entity-title">
            <div class="entity-title-main">
              <h4><span class="model-name" data-ref="modelName"></span></h4>
              <span class="pill status-pill" data-ref="modelStatusPill"></span>
              <div class="model-updates-line">
                model updates: <span data-ref="modelUpdatesStats"></span>
              </div>
            </div>
            <button type="button" class="restore-btn" data-ref="restoreModelButton" hidden>
              Restore
            </button>
          </div>
          <ul class="model-info">
            <li>version: <span data-ref="modelVersion"></span></li>
            <li> words: <span data-ref="selectedWordsCount"></span></li>
            <li> version updates: <span data-ref="versionUpdatesStats"></span></li>
            <li><a data-ref="modelLink" target="_blank">View Model</a></li>
          </ul>
        </li>
      </template>
    </div>
  </ui-rest>
</body>

</html>
