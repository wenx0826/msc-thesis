<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow Viewer</title>
  <style>
    @font-face {
      font-family: adawaita-sans;
      src: url("https://cpee.org/js_libs/AdwaitaSans-Regular.ttf");
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: adawaita-sans, Arial, sans-serif;
    }

    #graphRenderStatus {
      display: none;
      margin: 0;
      padding: 0.75rem 1rem;
      color: #2f3d4a;
      font-size: 14px;
    }

    #graphRenderStatus[data-state="error"] {
      color: #9f1d1d;
    }

    #modelGridSmall {
      padding: 1rem;
      box-sizing: border-box;
      overflow: auto;
      min-height: calc(100vh - 3rem);
    }
  </style>
  <script src="https://cpee.org/js_libs/jquery.min.js"></script>
  <script src="https://cpee.org/js_libs/underscore.min.js"></script>
  <script src="https://cpee.org/js_libs/printf.js"></script>
  <script src="https://cpee.org/js_libs/util.js"></script>
  <script src="js_libs_backup/wfadaptor.js"></script>
  <link rel="stylesheet" href="js_libs_backup/wfadaptor.css" />
  <script src="modules/workflow/themes/base_new.js"></script>
  <script src="modules/workflow/themes/base_customized.js"></script>
  <script src="pages/workflow-viewer-init.js"></script>
</head>

<body>
  <p id="graphRenderStatus" role="status" aria-live="polite"></p>
  <div id="modelGridSmall">
    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:x="http://www.w3.org/1999/xlink" id="modelCanvasSmall"
      width="1" height="1" style="display: block"></svg>
  </div>

</body>

</html>
