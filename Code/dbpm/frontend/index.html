<body is="x-ui-">
    <ui-bar>
        <div class="right"><a>Tutorial</a></div>
    </ui-bar>
    <ui-rest>
        <h1>Document-Based Process Modeller</h1>
        <button id="btnCreate">Create New Project</button>
        <ui-tabbar>
            <ui-before></ui-before>
            <ui-tab data-tab="projects" class>Projects</ui-tab>
            <ui-tab data-tab="dashboard" class="inactive">Dashboard</ui-tab>
            <ui-behind></ui-behind>
        </ui-tabbar>
        <ui-content class="noselect">
            <ui-area data-belongs-to-tab="projects">
                <table id="projectTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Documents</th>
                            <th>Models</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template id="rowtemplate">
                            <tr class="" data-project-id="">
                                <td><a href=""><em>no name</em></a></td>
                                <td class="doc-count"></td>
                                <td class="model-count"></td>
                                <td class="created"></td>
                                <td class="actions" title="Click for actions">...</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </ui-area>
            <ui-area data-belongs-to-tab="dashboard" class="inactive"></ui-area>
        </ui-content>
    </ui-rest>
    <ui-divider></ui-divider>
    <ui-bar>
        <span>Contact me </span><a href="mailto:xin.wen@tum.de">xin.wen@tum.de</a>
    </ui-bar>
    <dialog id="dlg">
        <form id="form" method="dialog">
            <h3>New Project</h3>
            <label for="name">Project name</label>
            <input id="name" type="text" autocomplete="off" />
            <div class="error" id="err"></div>
            <ui-bar class="actions">
                <div class="right">
                    <button type="button" id="cancel">Cancel</button>
                    <button type="submit" id="save">Create</button>
                </div>
            </ui-bar>
        </form>
    </dialog>
</body>
