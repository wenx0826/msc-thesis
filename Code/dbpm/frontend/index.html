<body is="x-ui-">
    <div class="home-intro">
        <h1>Document-Based Process Modeller</h1>
        <button id="btnCreate"> <span class="btn-primary__icon" aria-hidden="true">+</span><span>Create New
                Project</span></button>
    </div>
    <ui-rest>
        <div class="page-rail">
            <!-- <ui-rest> -->
            <ui-tabbar>
                <ui-before></ui-before>
                <ui-tab data-tab="projects" class>Projects</ui-tab>
                <ui-tab data-tab="dashboard" class="inactive">Dashboard</ui-tab>
                <ui-behind></ui-behind>
            </ui-tabbar>
            <ui-content>
                <ui-area data-belongs-to-tab="projects">
                    <table id="projectsTable">
                        <thead>
                            <tr>
                                <th class>Name</th>
                                <th class="col-num">Documents</th>
                                <th class="col-num">Models</th>
                                <th class="col-date">Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template id="projectRowTemplate">
                                <tr data-project-id="">
                                    <td class="clickable" data-ref="projectName"></td>
                                    <td class="col-num" data-ref="documentsCount"></td>
                                    <td class="col-num" data-ref="modelsCount"></td>
                                    <td class="col-date" data-ref="createdAt"></td>
                                    <td class="clickable" data-ref="actions" title="Click for actions" class="center">
                                        ...</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </ui-area>
                <ui-area data-belongs-to-tab="dashboard" class="inactive"></ui-area>
            </ui-content>
            <!-- </ui-rest> -->
        </div>
    </ui-rest>
    <ui-divider></ui-divider>
    <ui-bar class="home-footer">
        <div class="middle">If you encounter any issues or the system behaves unexpectedly, please contact:&nbsp;<a
                href="mailto:xin.wen@tum.de">xin.wen@tum.de</a></div>
    </ui-bar>
    <dialog id="projectCreationDialog">
        <form id="form" method="dialog">
            <h3>New Project</h3>
            <label for="name">Name</label>
            <input id="name" type="text" autocomplete="off" />
            <div class="error" id="err"></div>
            <ui-bar>
                <div class="right">
                    <button type="button" id="cancel">Cancel</button>
                    <button type="submit" id="save">Create</button>
                </div>
            </ui-bar>
        </form>
    </dialog>

</body>
</html>
