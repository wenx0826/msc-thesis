<body is="x-ui-">
  <ui-bar>
    <div>
      <span style="font-size: 1.2em;"><a href="index.html" title="Home"><svg width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9,22 9,12 15,12 15,22"></polyline>
          </svg></a></span>
      <span class="separator added">/</span>
      <span><a id="projectLink"></a></span>
      <span class="separator added">/</span>
      <span>Statistics</span>
    </div>
    <div class="right action-group">
      <!-- <span>Theme: Preset</span>
      <span>LLM: gemini 2 Flash</span>
      <a id="logLink" href="" target="_blank">Log</a>
      <a id="statsLink" href="stats.html" target="_blank">Stats</a> -->
    </div>
  </ui-bar>
  <!-- <a href="index.html" class="back-link">← Back to Projects</a> -->
  <ul id="documentsList">
  </ul>
  <template id="documentItemTemplate">
    <li data-doc-id="">
      <h3><span data-ref="documentName"></span></h3>
      <div>
        words: <span data-ref="wordsCount"></span>
        |
        models: <span data-ref="numModels"></span>
        | <a data-ref="documentLink" target="_blank">View Document</a>
      </div>
      <ul data-ref="modelsList">

      </ul>
    </li>
  </template>
  <template id="modelItemTemplate">
    <li data-model-id="">
      <h4><span data-ref="modelName"></span></h4>
      <div>
        words: <span data-ref="selectedWordsCount"></span>
        |
        models: <span data-ref="numModels"></span>
      </div>
    </li>
  </template>
</body>

</html>
