          <dbpm:document_id>cadb1979-cff1-4bcc-b66e-8c0559b56f0a</dbpm:document_id>
          <dbpm:text_selections>separate process models.
    - User can navigate between parent and child models.
    - Hierarchical model relationships are preserved.

    7. Model Management
    - Multiple models are stored and listed.
    - User switches between models and views previews.
    - Models can be updated or reused.

    8. Output
    - Finalized process models are exported.
    - Traceability between documents and processes is retained.</dbpm:text_selections>
        </dbpm:document_info>
      </dbpm:info>
      <description xmlns="http://cpee.org/ns/description/1.0" svg-id="description" svg-type="description" svg-subtype="description">
        <loop mode="pre_test" condition="true" svg-id="loop_1" svg-label="true" svg-type="loop" svg-subtype="loop_head">
          <parallel wait="-1" cancel="last" svg-id="parallel_0" svg-type="parallel" svg-subtype="parallel_start">
            <loop mode="pre_test" condition="data.i &lt; 4" svg-id="loop_0" svg-label="data.i &lt; 4" svg-type="loop" svg-subtype="loop_head">
              <_probability>
                <_probability_min/>
                <_probability_max/>
                <_probability_avg/>
              </_probability>
              <parallel_branch svg-id="parallel_branch_0" svg-type="parallel_branch" svg-subtype="parallel_branch_event">
                <call id="a1" svg-id="a1" svg-label="Start" svg-type="call" svg-subtype="call"><parameters><label>Start</label><color/><type>task</type><model/></parameters></call>
              </parallel_branch>
              <manipulate id="a4" label="" svg-id="a4" svg-type="manipulate" svg-subtype="manipulate">data.i += 1</manipulate>
            </loop>
          </parallel>
          <manipulate id="a3" label="" svg-id="a3" svg-type="manipulate" svg-subtype="manipulate">data.i = 0</manipulate>
          <_probability>
            <_probability_min/>
            <_probability_max/>
            <_probability_avg/>
          </_probability>
          <stop id="a2" svg-id="a2" svg-type="stop" svg-subtype="stop"/>
        </loop>
      </description>
