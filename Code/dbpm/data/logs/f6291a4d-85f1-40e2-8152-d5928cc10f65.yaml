      <description xmlns="http://cpee.org/ns/description/1.0">
        <loop mode="pre_test" condition="data.places.length &gt; 0">
          <_probability>
            <_probability_min/>
            <_probability_max/>
            <_probability_avg/>
          </_probability>
          <manipulate id="a2" label="Next Place">data.place = data.places.shift</manipulate>
          <call id="a1" endpoint="overview">
            <parameters>
              <label>Move to overview position</label>
              <arguments/>
              <stream>
                <sensors/>
                <aggregators/>
                <costs/>
              </stream>
            </parameters>
            <annotations>
              <_timing>
                <_timing_wait/>
                <_timing_threshold/>
                <_timing_min/>
                <_timing_max/>
                <_timing_avg/>
              </_timing>
              <_notes>
                <_notes_general/>
              </_notes>
            </annotations>
            <documentation/>
          </call>
          <call id="a3" endpoint="get_items_neural">
            <parameters>
              <label>Get item positions</label>
              <arguments/>
              <stream>
                <sensors/>
                <aggregators/>
                <costs/>
              </stream>
            </parameters>
            <code>
              <prepare/>
              <finalize output="result">data.items = result
    data.item = result[0]</finalize>
              <update output="result"/>
              <rescue output="result"/>
            </code>
            <annotations>
              <_timing>
                <_timing_wait/>
                <_timing_threshold/>
                <_timing_min/>
                <_timing_max/>
                <_timing_avg/>
              </_timing>
              <_notes>
                <_notes_general/>
              </_notes>
            </annotations>
            <documentation/>
          </call>
          <choose mode="exclusive">
            <alternative condition="data.items.length &gt; 0">
              <call id="a5" endpoint="move_camera">
                <parameters>
                  <label>Inspect first item</label>
                  <arguments>
                    <x>!data.item['x']</x>
                    <y>!data.item['y']</y>
                  </arguments>
                  <stream>
                    <sensors/>
                    <aggregators/>
                    <costs/>
                  </stream>
                </parameters>
                <annotations>
                  <_timing>
                    <_timing_wait/>
                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
                </annotations>
                <documentation/>
              </call>
              <call id="a6" endpoint="get_offset_neural">
                <parameters>
                  <label>Get item offset</label>
                  <arguments/>
                  <stream>
                    <sensors/>
                    <aggregators/>
                    <costs/>
                  </stream>
                </parameters>
                <code>
                  <prepare/>
                  <finalize output="result">data.adjusted = {
      'x' =&gt; data.item['x'] + result['dir_x'],
      'y' =&gt; data.item['y'] + result['dir_y']
    }</finalize>
                  <update output="result"/>
                  <rescue output="result"/>
                </code>
                <annotations>
                  <_timing>
                    <_timing_wait/>
                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
                </annotations>
                <documentation/>
              </call>
              <call id="a8" endpoint="grip_and_place">
                <parameters>
                  <label>Grip and Place</label>
                  <arguments>
                    <x>!data.adjusted['x'].round(0)</x>
                    <y>!data.adjusted['y'].round(0)</y>
                    <place_x>!data.place[0]</place_x>
                    <place_y>!data.place[1]</place_y>
                  </arguments>
                  <stream>
                    <sensors/>
                    <aggregators/>
                    <costs/>
                  </stream>
                </parameters>
                <annotations>
                  <_timing>
                    <_timing_wait/>
                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
                </annotations>
                <documentation/>
              </call>
              <_probability>
                <_probability_min/>
                <_probability_max/>
                <_probability_avg/>
              </_probability>
            </alternative>
            <otherwise>
              <terminate/>
            </otherwise>
          </choose>
        </loop>
      </description>
    </description>
