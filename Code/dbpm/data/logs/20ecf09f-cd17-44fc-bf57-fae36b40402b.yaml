data:
  id: f7d1d331-3619-498b-b2be-84ae9f1ff664
  data: |-
    <description>
      <dbpm:info xmlns:dbpm="https://example.com/dbpm">
        <dbpm:document_info>
          <dbpm:document_id>aa21ec19-d805-4b19-b22e-4feb4212e962</dbpm:document_id>
          <dbpm:text_selections>Document-Based Process Modeling – Core Process

    1. Document Ingestion
    - User uploads one or more documents (text, PDF, or Word).
    - System stores documents and extracts textual content.

    2. Document Selection
    - User selects a document for analysis.
    - System displays document content and previously identified text segments.

    3. Process Extraction
    - System analyzes selected document text.
    - Relevant text fragments are identified and linked to process steps.
    - User triggers model generation or regeneration.

    4. Process Model Generation
    - System creates a visual process model from extracted information.
    - Process includes tasks, decisions, flows, and subprocesses.
    - Each model element is linked to its source document text.

    5. Model Refinement
    - User reviews and edits the generated process model.
    - User defines task types, conditions, and subprocess relationships.
    - System maintains traceability between model elements and document fragments.

    6. Subprocess Linking
    - Subprocesses reference separate process models.
    - User can navigate between parent and child models.
    - Hierarchical model relationships are preserved.

    7. Model Management
    - Multiple models are stored and listed.
    - User switches between models and views previews.
    - Models can be updated or reused.

    8. Output
    - Finalized process models are exported.
    - Traceability between documents and processes is retained.</dbpm:text_selections>
        </dbpm:document_info>
      </dbpm:info>
      <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0" svg-id="description" svg-type="description" svg-subtype="description">
        <call id="a1" endpoint="" a:alt_id="1" svg-id="a1" svg-label="Analyze Document Text" svg-type="call" svg-subtype="call">
          <parameters>
            <label>Analyze Document Text</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <call id="a3" endpoint="" a:alt_id="2" svg-id="a3" svg-label="Identify Text Fragments" svg-type="call" svg-subtype="call">
          <parameters>
            <label>Identify Text Fragments</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <call id="a5" svg-id="a5" a:alt_id="3" svg-label="Trigger Model Generation" svg-type="call" svg-subtype="call"><parameters><label>Trigger Model Generation</label><color>#e4c3e4</color><dbpm_type>task</dbpm_type><dbpm_subprocess_model/></parameters></call>
        <call id="a7" svg-id="a7" a:alt_id="4" svg-label="Create Visual Process Model" svg-type="call" svg-subtype="call"><parameters><label>Create Visual Process Model</label><color>#f8a8c6</color><dbpm_type>task</dbpm_type><dbpm_subprocess_model/></parameters></call>
        <call id="a9" svg-id="a9" a:alt_id="5" svg-label="Review and Edit Model" svg-type="call" svg-subtype="call"><parameters><label>Review and Edit Model</label><color>#ffffcc</color><dbpm_type>task</dbpm_type><dbpm_subprocess_model/></parameters></call>
        <call id="a11" endpoint="" a:alt_id="6" svg-id="a11" svg-label="Define Task" svg-type="call" svg-subtype="call">
