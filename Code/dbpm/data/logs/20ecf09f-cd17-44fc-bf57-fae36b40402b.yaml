event: model_updated_manual_update_graph_properties_only
data:
  id: 2ee68549-f07e-4e78-bc96-1668467c91ef
  data: |-
    <description>
      <dbpm:info xmlns:dbpm="https://example.com/dbpm">
        <dbpm:document_info>
          <dbpm:document_id>aa21ec19-d805-4b19-b22e-4feb4212e962</dbpm:document_id>
          <dbpm:text_selections>ocument-Based Process Modeling – Core Process

    1. Document Ingestion
    - User uploads one or more documents (text, PDF, or Word).
    - System stores documents and extracts textual content.

    2. Document Selection
    - User selects a document for analysis.
    - System displays document content and previously identified text segments.

    3. Process Extraction
    - System analyzes selected document text.
    - Relevant text fragments are identified and linked to process steps.
    - User triggers model generation or regeneration.

    4. Process Model Generation
    - System creates a visual process model from extracted information.
    - Process includes tasks, decisions, flows, and subprocesses.
    - Each model element is linked to its source document text.

    5. Model Refinement
    - User reviews and edits the generated process model.
    - User defines task types, conditions, and subprocess relationships.
    - System maintains traceability between model elements and document fragments.

    6. Subprocess Linking
    - Subprocesses reference separate process models.
    - User can navigate between parent and child models.
    - Hierarchical model relationships are preserved.

    7. Model Management
    - Multiple models are stored and listed.
    - User switches between models and views previews.
    - Models can be updated or reused.

    8. Output
    - Finalized process models are exported.
    - Traceability between documents and processes is retained. 7. Model Management
    - Multiple models are stored and listed.
    - User switches between models and views previews.
    - Models can be updated or reused.

    8. Output
    - Finalized process models are exported.
    - Traceability between documents and processes is retained.</dbpm:text_selections>
        </dbpm:document_info>
      </dbpm:info>
      <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0" svg-id="description" svg-type="description" svg-subtype="description">
        <call id="a1" svg-id="a1" a:alt_id="1" svg-label="Store and List Models" svg-type="call" svg-subtype="call"><parameters><label>Store and List Models</label><color>#ffffcc</color><dbpm_type>task</dbpm_type><dbpm_subprocess_model/></parameters></call>
        <call id="a3" svg-id="a3" a:alt_id="2" svg-label="Switch Between Models and Preview" svg-type="call" svg-subtype="call"><parameters><label>Switch Between Models and Preview</label><color>#f8a8c6</color><dbpm_type>task</dbpm_type><dbpm_subprocess_model/></parameters></call>
        <choose mode="exclusive" a:alt_id="3" svg-id="choose_0" svg-type="choose" svg-subtype="choose_exclusive">
          <alternative condition="Update Model" language="text/javascript" svg-id="alternative_0" svg-label="Update Model" svg-type="alternative" svg-subtype="alternative">
            <call id="a7" svg-id="a7" a:alt_id="4" svg-label="Update Model" svg-type="call" svg-subtype="call"><parameters><label>Update Model</label><color>#deddda</color><dbpm_type>task</dbpm_type><dbpm_subprocess_model/></parameters></call>
          </alternative>
          <alternative condition="Reuse Model" language="text/javascript" svg-id="alternative_1" svg-label="Reuse Model" svg-type="alternative" svg-subtype="alternative">
            <call id="a9" svg-id="a9" a:alt_id="5" svg-label="Reuse Model" svg-type="call" svg-subtype="call"><parameters><label>Reuse Model</label><color>#e4c3e4</color><dbpm_type>task</dbpm_type><dbpm_subprocess_model/></parameters></call>
          </alternative>
        </choose>
        <call id="a15" svg-id="a15" a:alt_id="7" svg-label="Export Finalized Process Models" svg-type="call" svg-subtype="call"><parameters><label>Export Finalized Process Models</label><color/><dbpm_type>subprocess</dbpm_type><dbpm_subprocess_model>12db61b6-6577-43bb-9a72-e0c58538e697</dbpm_subprocess_model></parameters></call>
        <call id="a17" endpoint="" a:alt_id="8" svg-id="a17" svg-label="Retain Traceability" svg-type="call" svg-subtype="call">
          <parameters>
            <label>Retain Traceability</label>
            <method/>
            <type>:task</type>
            <arguments/>
