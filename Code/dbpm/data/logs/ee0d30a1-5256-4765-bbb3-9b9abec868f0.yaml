            <parallel_branch svg-id="parallel_branch_0" svg-type="parallel_branch" svg-subtype="parallel_branch_event">
              <call id="a2" endpoint="subprocess" svg-id="a2" svg-label="Book Hotel" svg-type="call" svg-subtype="call"><parameters><label>Book Hotel</label><color/><dbpm_type>subprocess</dbpm_type><dbpm_subprocess_model>b91d2def-24fc-4d5c-8529-c7ccbd1c50b9</dbpm_subprocess_model><arguments><behavior>wait_for_running</behavior><url>http://localhost:3000/data/models/b91d2def-24fc-4d5c-8529-c7ccbd1c50b9.xml</url></arguments></parameters></call>
            </parallel_branch>
            <manipulate id="a3" svg-id="a3" svg-type="manipulate" svg-subtype="manipulate">data.persons -= 1</manipulate>
