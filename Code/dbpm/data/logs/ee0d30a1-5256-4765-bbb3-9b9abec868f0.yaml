          <dbpm:text_selections>An industry is a group of firms producing products and services that are essentially the same. Examples are the automobile industry and the airline industry. Industries are also often described as 'sectors', especially in public services (e.g. the health sector or the education sector). Industries and sectors are often made up of several specific markets. A market is a group of customers for specific products or services that are essentially the same (e.g. a particular geographical market). Thus the automobile industry has markets in North America. Europe and Asia. for example.</dbpm:text_selections>
