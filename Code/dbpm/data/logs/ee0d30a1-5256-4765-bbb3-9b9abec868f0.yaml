  data: |-
    <description>
      <dbpm:info xmlns:dbpm="https://example.com/dbpm">
        <dbpm:document_info>
          <dbpm:document_id>d7591e5a-b611-4b54-b55c-b144fa3e4581</dbpm:document_id>
          <dbpm:text_selections>ut market segments is correct? Market segments are groups of customers with different needs th</dbpm:text_selections>
        </dbpm:document_info>
      </dbpm:info>
      <description xmlns="http://cpee.org/ns/description/1.0" svg-id="description" svg-type="description" svg-subtype="description">
        <call id="a1" endpoint="bookAir" svg-id="a1" svg-label="Book Airline 1" svg-type="call" svg-subtype="callmanipulate">
          <parameters>
            <label>Book Airline 1</label>
            <method>:post</method>
            <arguments>
              <from>!data.from</from>
              <to>!data.to</to>
              <persons>!data.persons</persons>
            </arguments>
          </parameters>
          <code>
            <prepare/>
            <finalize output="result">data.airline = result.value('id')
    data.costs += result.value('costs').to_f
    status.update 1, 'Hotel'</finalize>
            <update output="result"/>
            <rescue output="result"/>
          </code>
          <annotations>
            <_timing>
              <_timing_weight/>
              <_timing_avg/>
              <explanations/>
            </_timing>
            <_shifting>
              <_shifting_type>Duration</_shifting_type>
            </_shifting>
            <_context_data_analysis>
              <probes/>
              <ips/>
            </_context_data_analysis>
            <report>
              <url/>
            </report>
            <_notes>
              <_notes_general/>
            </_notes>
          </annotations>
          <documentation>
            <input/>
            <output/>
            <implementation>
              <description/>
            </implementation>
            <code>
              <description/>
            </code>
          </documentation>
        </call><call xmlns="http://cpee.org/ns/description/1.0" id="a7" endpoint="" svg-id="a7" svg-type="call" svg-subtype="call"><parameters><label/><color>#e4c3e4</color><dbpm_type>task</dbpm_type></parameters></call><call xmlns="http://cpee.org/ns/description/1.0" id="a6" endpoint="" svg-id="a6" svg-type="call" svg-subtype="call"><parameters><label/><color/><dbpm_type>task</dbpm_type><dbpm_subprocess_model/><arguments/></parameters></call><call xmlns="http://cpee.org/ns/description/1.0" id="a5" endpoint="" svg-id="a5" svg-type="call" svg-subtype="call"><parameters><label/><color/><dbpm_type>task</dbpm_type><dbpm_subprocess_model/><arguments/></parameters></call>
        <parallel wait="-1" cancel="last" svg-id="parallel_0" svg-type="parallel" svg-subtype="parallel_start">
          <loop mode="pre_test" condition="data.persons &gt; 0" svg-id="loop_0" svg-label="data.persons &gt; 0" svg-type="loop" svg-subtype="loop_head">
            <parallel_branch svg-id="parallel_branch_0" svg-type="parallel_branch" svg-subtype="parallel_branch_event">
              <call id="a2" endpoint="subprocess" svg-id="a2" svg-label="Book Hotel" svg-type="call" svg-subtype="call"><parameters><label>Book Hotel</label><color>#ffffcc</color><dbpm_type>subprocess</dbpm_type><dbpm_subprocess_model>4789e4b6-ea31-4d35-a4e2-4ddc042b435d</dbpm_subprocess_model></parameters></call>
            </parallel_branch>
            <manipulate id="a3" svg-id="a3" svg-type="manipulate" svg-subtype="manipulate">data.persons -= 1</manipulate>
          </loop>
        </parallel>
        <choose mode="exclusive" svg-id="choose_0" svg-type="choose" svg-subtype="choose_exclusive">
          <alternative condition="data.costs &gt; 700" svg-id="alternative_0" svg-label="data.costs &gt; 700" svg-type="alternative" svg-subtype="alternative">
            <_probability>
              <_probability_min/>
              <_probability_max/>
              <_probability_avg/>
            </_probability>
            <call id="a4" endpoint="subprocess" svg-id="a4" svg-label="Approve Hotel" svg-type="call" svg-subtype="call"><parameters><label>Approve Hotel</label><color/><dbpm_type>subprocess</dbpm_type><dbpm_subprocess_model>035bde3e-8950-4705-865d-a67ed4ef35e3</dbpm_subprocess_model></parameters></call>
          </alternative>
          <otherwise svg-id="otherwise_0" svg-type="otherwise" svg-subtype="otherwise"/>
        </choose>
      </description>
