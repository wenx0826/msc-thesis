ic industries. Monopolistic industries. Perfectly competitive industries. Hypercompetitive industries. Source: SS20 | Lecturer: | Version: 0 | Block: THE ENVIRONMENT | Chapter: Book – Exploring Strategy | | Us: 0.38 | h: e516b688 c) What does the Porter’s Five Forces Framework try to identify in terms of competitive forces? The profitability of an industry  ×   The attractiveness of an industry The competition of an industry The threat of an industry Source: SS19 | Lecturer: grundke | Version: 1 | Block: THE ENVIRONMENT | C</dbpm:text_selections>\n    </dbpm:document_info>\n  </dbpm:info>\n  <description xmlns=\"http://cpee.org/ns/description/1.0\">\n    <call id=\"a1\" endpoint=\"bookAir\">\n      <parameters>\n        <label>Book Airline 1</label>\n        <method>:post</method>\n        <arguments>\n          <from>!data.from</from>\n          <to>!data.to</to>\n          <persons>!data.persons</persons>\n        </arguments>\n      </parameters>\n      <code>\n        <prepare/>\n        <finalize output=\"result\">data.airline = result.value('id')\ndata.costs += result.value('costs').to_f\nstatus.update 1, 'Hotel'</finalize>\n        <update output=\"result\"/>\n        <rescue output=\"result\"/>\n      </code>\n      <annotations>\n        <_timing>\n          <_timing_weight/>\n          <_timing_avg/>\n          <explanations/>\n        </_timing>\n        <_shifting>\n          <_shifting_type>Duration</_shifting_type>\n        </_shifting>\n        <_context_data_analysis>\n          <probes/>\n          <ips/>\n        </_context_data_analysis>\n        <report>\n          <url/>\n        </report>\n        <_notes>\n          <_notes_general/>\n        </_notes>\n      </annotations>\n      <documentation>\n        <input/>\n        <output/>\n        <implementation>\n          <description/>\n        </implementation>\n        <code>\n          <description/>\n        </code>\n      </documentation>\n    </call>\n    <parallel wait=\"-1\" cancel=\"last\">\n      <loop mode=\"pre_test\" condition=\"data.persons &gt; 0\">\n        <parallel_branch>\n          <call id=\"a2\" endpoint=\"bookHotel\">\n            <parameters>\n              <label>Book Hotel</label>\n              <method>:post</method>\n              <arguments>\n                <to>!data.to</to>\n              </arguments>\n            </parameters>\n            <code>\n              <prepare/>\n              <finalize output=\"result\">data.hotels &lt;&lt; result.value('id')\ndata.costs += result.value('costs').to_f</finalize>\n              <update output=\"result\"/>\n              <rescue output=\"result\"/>\n            </code>\n            <annotations>\n              <_timing>\n                <_timing_weight/>\n                <_timing_avg/>\n                <explanations/>\n              </_timing>\n              <_shifting>\n                <_shifting_type>Duration</_shifting_type>\n              </_shifting>\n              <_context_data_analysis>\n                <probes/>\n                <ips/>\n              </_context_data_analysis>\n              <report>\n                <url/>\n              </report>\n              <_notes>\n                <_notes_general/>\n              </_notes>\n            </annotations>\n            <documentation>\n              <input/>\n              <output/>\n              <implementation>\n                <description/>\n              </implementation>\n              <code>\n                <description/>\n              </code>\n            </documentation>\n          </call>\n        </parallel_branch>\n        <manipulate id=\"a3\">data.persons -= 1</manipulate>\n      </loop>\n    </parallel>\n    <choose mode=\"exclusive\">\n      <alternative condition=\"data.costs &gt; 700\">\n        <_probability>\n          <_probability_min/>\n          <_probability_max/>\n          <_probability_avg/>\n        </_probability>\n        <call id=\"a4\" endpoint=\"approve\">\n          <parameters>\n      