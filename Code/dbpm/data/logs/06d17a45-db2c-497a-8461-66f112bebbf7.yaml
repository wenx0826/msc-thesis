data:
  id: c7e8c3ee-c527-4349-9002-741669939adb
  name: Model_3
  data: |-
    <description>
      <dbpm:info
        xmlns:dbpm="https://example.com/dbpm">
        <dbpm:document_info>
          <dbpm:document_id>9276885a-9027-4fb4-bc67-fc41258a3fa8</dbpm:document_id>
          <dbpm:text_selections>1. Document Ingestion
    - User uploads one or more documents (text, PDF, or Word).
    - System stores documents and extracts textual content.</dbpm:text_selections>
        </dbpm:document_info>
      </dbpm:info>
      <description xmlns="http://cpee.org/ns/description/1.0">
        <loop mode="pre_test" condition="data.places.length &gt; 0">
          <_probability>
            <_probability_min/>
            <_probability_max/>
            <_probability_avg/>
          </_probability>
          <call id="a1" endpoint="overview">
            <parameters>
              <label>Move to overview position</label>
              <arguments/>
              <stream>
                <sensors/>
                <aggregators/>
                <costs/>
              </stream>
            </parameters>
            <annotations>
              <_timing>
                <_timing_wait/>
                <_timing_threshold/>
                <_timing_min/>
                <_timing_max/>
                <_timing_avg/>
              </_timing>
              <_notes>
                <_notes_general/>
              </_notes>
            </annotations>
            <documentation/>
          </call>
          <call id="a3" endpoint="get_items_base">
            <parameters>
              <label>Get item positions</label>
              <arguments/>
              <stream>
                <sensors/>
                <aggregators/>
                <costs/>
              </stream>
            </parameters>
            <code>
              <prepare/>
              <finalize output="result">data.items = result</finalize>
              <update output="result"/>
              <rescue output="result"/>
            </code>
            <annotations>
              <_timing>
                <_timing_wait/>
                <_timing_threshold/>
                <_timing_min/>
                <_timing_max/>
                <_timing_avg/>
              </_timing>
              <_notes>
                <_notes_general/>
              </_notes>
            </annotations>
            <documentation/>
          </call>
          <choose mode="exclusive">
            <alternative condition="data.items.length &gt; 0">
              <call id="a5" endpoint="move_camera">
                <parameters>
                  <label>Inspect first item</label>
                  <arguments>
                    <x>!data.items.first['x']</x>
                    <y>!data.items.first['y']</y>
                  </arguments>
                  <stream>
                    <sensors/>
                    <aggregators/>
                    <costs/>
                  </stream>
                </parameters>
                <annotations>
                  <_timing>
                    <_timing_wait/>
                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
                </annotations>
                <documentation/>
              </call>
              <call id="a2" endpoint="subprocess">
                <parameters>
                  <label>Adjust</label>
                  <method>:post</method>
                  <arguments>
                    <behavior>wait_running</behavior>
                    <url>https://cpee.org/flow/templates/UR-VUE%202020%20Manual%20Adjust.xml</url>
                    <init/>
                    <endpoints/>
                    <stream/>
                  </arguments>
                  <stream>
                    <sensors/>
                    <aggregators/>
                    <costs/>
                  </stream>
                </parameters>
                <code>
                  <prepare/>
                  <finalize output="result">data.place = data.places.shift
    data.item = result['item']
    data.item['x'] = data.items.first['x'] + data.item['adjust_x']
    data.item['y'] = data.items.first['y'] + data.item['adjust_y']</finalize>
                  <update output="result"/>
                  <rescue output="result"/>
                </code>
                <annotations>
                  <_timing>
                    <_timing_wait/>
                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
                </annotations>
                <documentation/>
              </call>
              <call id="a8" endpoint="grip_and_place">
                <parameters>
                  <label>Grip and Place</label>
                  <arguments>
                    <x>!data.item['x']</x>
                    <y>!data.item['y']</y>
                    <place_x>!data.place[0]</place_x>
                    <place_y>!data.place[1]</place_y>
                  </arguments>
                  <stream>
                    <sensors/>
                    <aggregators/>
                    <costs/>
                  </stream>
                </parameters>
                <annotations>
                  <_timing>
                    <_timing_wait/>
                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
                </annotations>
                <documentation/>
              </call>
              <_probability>
                <_probability_min/>
                <_probability_max/>
                <_probability_avg/>
              </_probability>
            </alternative>
            <otherwise>
