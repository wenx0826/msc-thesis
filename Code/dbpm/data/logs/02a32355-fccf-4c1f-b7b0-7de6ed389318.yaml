                    <y>!data.adjusted['y'].round(0)</y>
                    <place_x>!data.place[0]</place_x>
                    <place_y>!data.place[1]</place_y>
                  </arguments>
                  <stream>
                    <sensors/>
                    <aggregators/>
                    <costs/>
                  </stream>
                </parameters>
                <annotations>
                  <_timing>
                    <_timing_wait/>
                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
