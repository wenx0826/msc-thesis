                    <_timing_threshold/>
                    <_timing_min/>
                    <_timing_max/>
                    <_timing_avg/>
                  </_timing>
                  <_notes>
                    <_notes_general/>
                  </_notes>
                </annotations>
                <documentation/>
              </call>
              <call id="a8" endpoint="grip_and_place">
                <parameters>
                  <label>Grip and Place</label>
