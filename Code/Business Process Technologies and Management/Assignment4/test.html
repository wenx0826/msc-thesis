<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Data</title>
    <link rel="icon" href="https://jscdn.com.cn/highcharts/images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      table {
        width: 600px;
        text-align: center;
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.5.0.js"></script>
    <script src="https://cdn.highcharts.com.cn/highcharts/highcharts.js"></script>
    <script src="https://cdn.highcharts.com.cn/highcharts/modules/exporting.js"></script>
    <script src="https://img.hcharts.cn/highcharts-plugins/highcharts-zh_CN.js"></script>
  </head>
  <body>
    <div id="container" style="min-width:400px;height:200px"></div>
    <table border="1" cellspacing="0">
      <thead>
        <tr>
          <th>Instance</th>
          <th>Refine Times</th>
          <th>Build Method</th>
          <th>Total Price</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <script>
      const rerender = () => {
        $("tbody").remove();
        $("table").append("<tbody></tbody>")
        let totalRevenue = 0
        let paidRevenue = 0
        $.getJSON("/~ga94hor/data.json", (data) => {
          const keys = ["instance", "refineTimes", "buildMethod"]
          for (const item of data) {
            const tr = document.createElement('tr')
            for (const key of keys) {
              const td = document.createElement('td')
              td.innerHTML = item[key];
              $(tr).append(td)
            }
            $("tbody").append(tr)
            if (item["bill"]) {
              const bill = item["bill"]
              const totalPrice = bill["designFee"] + bill["buildFee"]
              totalRevenue += totalPrice
              if (item["paid"]) paidRevenue += totalPrice;
              console.log(totalRevenue);
              console.log(bill);
            }
          }
          Highcharts.chart('container', {
            chart: {
              plotBackgroundColor: null,
              plotBorderWidth: null,
              plotShadow: false,
              type: 'pie',
            },
            title: {
              text: 'Total revenue:' + totalRevenue + ' €'
            },
            plotOptions: {
              pie: {
                allowPointSelect: true,
                cursor: 'pointer',
                dataLabels: {
                  enabled: true,
                  // format: '<b>{point.name}</b>: {point.y}€({point.percentage:.1f} %)',
                  format: '<b>{point.name}</b>: {point.percentage:.1f} %',
                  style: {
                    color: (Highcharts.theme && Highcharts.theme.contrastTextColor) || 'black'
                  }
                }
              }
            },
            series: [{
              name: 'Brands',
              colorByPoint: true,
              data: [{
                name: 'Paid',
                y: paidRevenue,
                sliced: true,
                selected: true
              }, {
                name: 'Unpaid',
                y: (totalRevenue - paidRevenue)
              }]
            }]
          });

        });
      }

      window.setInterval(() => {
        setTimeout(rerender, 0)
      }, 3000)
