<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f6f6f4;
            /* demo */
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            color: #1f1f1f;
        }

        .dashboard {
            background: #fff;
            border: 1px solid #e7e7e2;
            border-radius: 12px;
            padding: 32px 40px;
        }

        /* ===== KPI Row (Centered Columns) ===== */

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
            /* 关键：整体居中 */
        }

        .kpi-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 42px;
            font-weight: 600;
            line-height: 1;
        }

        .kpi-sub {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
        }

        /* ===== Distribution FULL WIDTH ===== */

        .distribution-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 100px;
            margin-top: 48px;
        }

        .dist-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 30px 1fr 40px;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: #666;
        }

        .bar-track {
            height: 6px;
            background: #ecece7;
        }

        .bar-fill {
            height: 100%;
            background: #555;
        }

        .bar-pct {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ===== Divider ===== */

        .divider {
            margin: 48px 0 28px;
            border-top: 1px solid #e5e5e0;
        }

        /* ===== Interaction (NARROW COLUMN) ===== */

        .interaction {
            max-width: 520px;
        }

        .interaction h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        .metric-label {
            color: #444;
        }

        .metric-value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width:1000px) {
            .kpi-row {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .distribution-row {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .interaction {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Top KPIs (Centered) -->
        <div class="kpi-row">

            <div>
                <div class="kpi-title">Projects</div>
                <div class="kpi-value">12</div>
            </div>

            <div>
                <div class="kpi-title">Documents</div>
                <div class="kpi-value">38</div>
                <div class="kpi-sub">avg words: 131</div>
            </div>

            <div>
                <div class="kpi-title">Models</div>
                <div class="kpi-value">64</div>
                <div class="kpi-sub">avg selected words: 43</div>
            </div>

        </div>

        <!-- Distribution -->
        <div class="distribution-row">

            <div>
                <div class="dist-title">Documents per Project</div>

                <div class="bar-row">
                    <div>1</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:42%"></div>
                    </div>
                    <div class="bar-pct">42%</div>
                </div>

                <div class="bar-row">
                    <div>2</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:31%"></div>
                    </div>
                    <div class="bar-pct">31%</div>
                </div>

                <div class="bar-row">
                    <div>3+</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:27%"></div>
                    </div>
                    <div class="bar-pct">27%</div>
                </div>
            </div>

            <div>
                <div class="dist-title">Models per Document</div>

                <div class="bar-row">
                    <div>1</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:56%"></div>
                    </div>
                    <div class="bar-pct">56%</div>
                </div>

                <div class="bar-row">
                    <div>2</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:28%"></div>
                    </div>
                    <div class="bar-pct">28%</div>
                </div>

                <div class="bar-row">
                    <div>3+</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:16%"></div>
                    </div>
                    <div class="bar-pct">16%</div>
                </div>
            </div>

        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Interaction -->
        <div class="interaction">
            <h3>Model Interaction Statistics</h3>

            <div class="metric-row">
                <div class="metric-label">avg prompt generations:</div>
                <div class="metric-value">5</div>
            </div>

            <div class="metric-row">
                <div class="metric-label">avg regenerations:</div>
                <div class="metric-value">8</div>
            </div>

            <div class="metric-row">
                <div class="metric-label">avg prompt updates:</div>
                <div class="metric-value">2</div>
            </div>

        </div>

    </div>

</body>

</html>
