<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Checkbox 多选示例</title>

<body>

    <h2>Checkbox 多选</h2>

    <form id="form" class="box">
        <label>
            <input type="checkbox" id="checkAll">
            全选
        </label>

        <hr />

        <label>
            <input type="checkbox" name="fruits[]" value="apple">
            Apple
        </label>

        <label>
            <input type="checkbox" name="fruits[]" value="banana">
            Banana
        </label>

        <label>
            <input type="checkbox" name="fruits[]" value="orange">
            Orange
        </label>

        <label>
            <input type="checkbox" name="fruits[]" value="grape">
            Grape
        </label>

        <button type="submit">提交</button>

        <div class="result" id="result">
            当前选中：[]
        </div>
    </form>

    <script>
        const form = document.getElementById('form');
        const checkAll = document.getElementById('checkAll');
        const items = document.querySelectorAll('input[name="fruits[]"]');
        const result = document.getElementById('result');

        function getCheckedValues() {
            return [...items]
                .filter(i => i.checked)
                .map(i => i.value);
        }

        function updateResult() {
            const values = getCheckedValues();
            result.textContent = '当前选中：' + JSON.stringify(values);

            // 同步全选状态
            checkAll.checked = values.length === items.length;
            checkAll.indeterminate =
                values.length > 0 && values.length < items.length;
        }

        // 单个 checkbox 变化
        items.forEach(i => {
            i.addEventListener('change', updateResult);
        });

        // 全选 / 取消全选
        checkAll.addEventListener('change', () => {
            items.forEach(i => {
                i.checked = checkAll.checked;
            });
            updateResult();
        });

        // 表单提交（演示用，不真正提交）
        form.addEventListener('submit', e => {
            e.preventDefault();
            alert('提交的数据：\n' + JSON.stringify(getCheckedValues(), null, 2));
        });

        // 初始化
        updateResult();
    </script>

</body>
</html>
